<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晶片專車極速派單系統 (Dispatch Pro)</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --text: #0f172a;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; }

    header {
      background: #0f172a;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.15rem; font-weight: 700; }

    .main-container {
      max-width: 1400px;
      margin: 14px auto;
      padding: 0 14px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 16px;
    }
    @media (max-width: 1024px) {
      .main-container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 6px;
    }

    /* 點擊流指示標籤 */
    .flow-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #e0f2fe;
      border: 1px solid #bae6fd;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #0369a1;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .flow-step-active {
      background: #0284c7;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* 常用廠區標籤網格 */
    .factory-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 150px;
      overflow-y: auto;
      padding: 4px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      margin-bottom: 14px;
    }
    .factory-chip {
      background: #fff;
      border: 1px solid #cbd5e1;
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s;
    }
    .factory-chip:hover {
      border-color: #0284c7;
      background: #f0f9ff;
      color: #0284c7;
    }

    /* 表單佈局 */
    .form-grid-3 { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 10px; margin-bottom: 8px; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
    @media (max-width: 640px) {
      .form-grid-3, .form-grid-2 { grid-template-columns: 1fr; }
    }
    .form-group { display: flex; flex-direction: column; gap: 3px; }
    .form-group label { font-size: 0.8rem; font-weight: 600; color: #475569; }
    .form-group input, .form-group select {
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      font-size: 0.85rem;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
    }

    .active-target {
      border: 2px solid #0284c7 !important;
      background: #f0f9ff;
    }

    .btn-quick {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-quick:hover { background: #e2e8f0; }

    .btn-submit {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }
    .btn-submit:hover { background: #0369a1; }

    .preview-box {
      background: #0f172a;
      color: #f8fafc;
      padding: 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-all;
      height: 220px;
      overflow-y: auto;
      margin-bottom: 8px;
    }
    .driver-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 5px;
      margin-bottom: 5px;
      font-size: 0.8rem;
      cursor: pointer;
      background: #fff;
    }
    .driver-item:hover { border-color: #0284c7; background: #f0f9ff; }
  </style>
</head>

    <h1>🚚 晶片專車極速派單 (點擊直覺流)</h1>
    <div style="font-size: 0.8rem; color: #94a3b8;">按 <kbd style="background:#334155; padding:2px 5px; border-radius:3px; color:#fff;">Ctrl + Enter</kbd> 開單</div>
  </header>
